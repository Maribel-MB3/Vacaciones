name: Process Vacation Request

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update-vacations:
    # Solo procesamos issues creadas con la plantilla de vacaciones
    # (el título siempre empieza por "[VACACIONES] " según la plantilla)
    if: startsWith(github.event.issue.title, '[VACACIONES]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process issue and update public/vacations.json
        id: process
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body = context.payload.issue.body || '';

            const employee =
              body.match(/### Empleado\s+([\s\S]*?)\s+### Departamento/)?.[1]*.trim();
            const department =
               body.match(/### Departamento\s+([\s\S]*?)\s+### Color avatar/)?.[1]?.trim();
            const avatarColor =
                    body.match(/### Color avatar\s+([\s\S]*?)\s+### Fecha inicio/)?.[1]?.trim();
            const start =
              body.match(/### Fecha inicio\s+([\s\S]*?)\s+### Fecha fin/)?.[1]?.trim();

            const end =
              body.match(/### Fecha fin\s+([\s\S]*?)\s+### Comentarios/)?.[1]?.trim();
            const status =
                body.match(/### Estado\s+([\s\S]*?)\s+### Comentarios/)?.[1]?.trim();
            const notes =
                body.match(/### Comentarios\s+([\s\S]*)/)?.[1]?.trim() || '';
            if (!employee || !department || !start || !end) {
              core.setFailed('No se pudieron extraer los datos (empleado, fecha inicio o fecha fin) del cuerpo de la issue.');
              return;
            }

            let vacations = [];

            if (fs.existsSync('public/vacations.json')) {
              const raw = fs.readFileSync('public/vacations.json', 'utf8').trim();
              vacations = raw ? JSON.parse(raw) : [];
            }

            vacations.push({id: vacationId,
              employee,
              department,
              avatarColor: avatarColor || '#5A5A40',
              start,
              end,
              type: 'vacation',status: status || 
              'approved',
              notes });

            fs.writeFileSync(
              'public/vacations.json',
              JSON.stringify(vacations, null, 2) + '\n'
            );

            core.setOutput('employee', employee);

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/vacations.json

          git diff --staged --quiet || git commit -m "Añadir vacaciones de ${{ steps.process.outputs.employee }}"
          git push

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Vacaciones guardadas correctamente. Ya se muestran en el calendario del equipo.'
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
