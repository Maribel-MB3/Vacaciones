name: Process Vacation Request

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: read

jobs:
  update-vacations:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Process issue
        uses: actions/github-script@v7
        with:
          script: |
            // código que lee la issue
            // y actualiza vacations.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add vacations.json

          git diff --staged --quiet || \
          git commit -m "Add approved vacation"

          git push
