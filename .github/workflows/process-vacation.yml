name: Process Vacation Request

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update-vacations:
    # Solo procesamos issues creadas con la plantilla de vacaciones
    # (el título siempre empieza por "[VACACIONES] " según la plantilla)
    if: startsWith(github.event.issue.title, '[VACACIONES]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process issue and update public/vacations.json
        id: process
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
             function generateColor(text) {
              let hash = 0;
            
              for (let i = 0; i < text.length; i++) {
                hash = text.charCodeAt(i) + ((hash << 5) - hash);
              }
            
              let color = '#';
            
              for (let i = 0; i < 3; i++) {
                const value = (hash >> (i * 8)) & 255;
                color += ('00' + value.toString(16)).slice(-2);
              }
            
              return color;
            }
            function getField(body, name) {
              const regex = new RegExp(
                `### ${name}\\s*([\\s\\S]*?)(?=\\n### |$)`,
                'm'
              );
            
              const match = body.match(regex);
            
              return match ? match[1].trim() : '';
            }
            
            const body = context.payload.issue.body || '';
            
            const employee = getField(body, 'Empleado');
            const start = getField(body, 'Fecha inicio');
            const end = getField(body, 'Fecha fin');
            const type = getField(body, 'Tipo') || 'vacation';
            const status = getField(body, 'Estado') || 'approved';
            const notes = getField(body, 'Comentarios');
            
            const department = 'Desarrollo';
            const avatarColor = generateColor(employee);
            
            console.log({
              employee,
              start,
              end,
              type,
              status,
              notes
            });

            if (!employee || !start || !end) {
              core.setFailed(
                `Datos no encontrados:
                employee=${employee}
                start=${start}
                end=${end}`
              );
              return;
            }


            
            if (!employee || !department || !start || !end) {
              core.setFailed('No se pudieron extraer los datos (empleado, fecha inicio o fecha fin) del cuerpo de la issue.');
              return;
            }

            let vacations = [];

            if (fs.existsSync('public/vacations.json')) {
              const raw = fs.readFileSync('public/vacations.json', 'utf8').trim();
              vacations = raw ? JSON.parse(raw) : [];
            }
            const vacationId = `vac-${vacations.length + 1}`;
            vacations.push({
              id: vacationId,
              employee,
              department,
              avatarColor,
              start,
              end,
              type,
              status,
              notes });

            fs.writeFileSync(
              'public/vacations.json',
              JSON.stringify(vacations, null, 2) + '\n'
            );

            core.setOutput('employee', employee);

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/vacations.json

          git diff --staged --quiet || git commit -m "Añadir vacaciones de ${{ steps.process.outputs.employee }}"
          git push

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Vacaciones guardadas correctamente. Ya se muestran en el calendario del equipo.'
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
           
