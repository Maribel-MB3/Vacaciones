name: Process Vacation Request

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: read

jobs:
  update-vacations:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body = context.payload.issue.body;

            const employee =
              body.match(/### Empleado\s+([\s\S]*?)\s+### Fecha inicio/)?.[1]?.trim();

            const start =
              body.match(/### Fecha inicio\s+([\s\S]*?)\s+### Fecha fin/)?.[1]?.trim();

            const end =
              body.match(/### Fecha fin\s+([\s\S]*?)\s+### Comentarios/)?.[1]?.trim();

            let vacations = [];

            if (fs.existsSync('vacations.json')) {
              vacations = JSON.parse(
                fs.readFileSync('vacations.json', 'utf8')
              );
            }

            vacations.push({
              employee,
              start,
              end
            });

            fs.writeFileSync(
              'vacations.json',
              JSON.stringify(vacations, null, 2)
            );

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add vacations.json

          git diff --staged --quiet || git commit -m "Add approved vacation"

          git push
