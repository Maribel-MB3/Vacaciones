name: Process Vacation Request

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: read

jobs:
  update-vacations:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show issue body
        run: |
          echo "${{ github.event.issue.body }}"

      - name: Process issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body = context.payload.issue.body;

            console.log(body);

      - name: Commit changes
        run: |
          echo "Debug mode"
