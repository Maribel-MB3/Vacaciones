name: Process Vacation Request

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update-vacations:
    # Solo procesamos issues creadas con la plantilla de vacaciones
    # (el título siempre empieza por "[VACACIONES] " según la plantilla)
    if: startsWith(github.event.issue.title, '[VACACIONES]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process issue and update public/vacations.json
        id: process
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
           
            const body = context.payload.issue.body || '';
            
            const employeeMatch =
                    body.match(/### Empleado\s+([\s\S]*?)\s+### Departamento/);
            const employee = employeeMatch ? employeeMatch[1].trim() : '';                  
            const department = 'Desarrollo';
            const avatarColor = generateColor(employee);
             const startMatch =
                    body.match(/### Fecha inicio\s+([\s\S]*?)\s+### Fecha fin/);
             const start = startMatch ? startMatch[1].trim() : '';
                  
                  const endMatch =
                    body.match(/### Fecha fin\s+([\s\S]*?)\s+### Estado/);
                  const end = endMatch ? endMatch[1].trim() : '';
                  
                  const statusMatch =
                    body.match(/### Estado\s+([\s\S]*?)\s+### Comentarios/);
                  const status = statusMatch ? statusMatch[1].trim() : 'approved';
                  
                  const notesMatch =
                    body.match(/### Comentarios\s+([\s\S]*)/);
                  const notes = notesMatch ? notesMatch[1].trim() : '';
            if (!employee || !department || !start || !end) {
              core.setFailed('No se pudieron extraer los datos (empleado, fecha inicio o fecha fin) del cuerpo de la issue.');
              return;
            }

            let vacations = [];

            if (fs.existsSync('public/vacations.json')) {
              const raw = fs.readFileSync('public/vacations.json', 'utf8').trim();
              vacations = raw ? JSON.parse(raw) : [];
            }
            const vacationId = `vac-${vacations.length + 1}`;
            vacations.push({
              id: vacationId,
              employee,
              department,
              avatarColor: avatarColor || '#5A5A40',
              start,
              end,
              type: 'vacation',
              status,
              notes });

            fs.writeFileSync(
              'public/vacations.json',
              JSON.stringify(vacations, null, 2) + '\n'
            );

            core.setOutput('employee', employee);

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/vacations.json

          git diff --staged --quiet || git commit -m "Añadir vacaciones de ${{ steps.process.outputs.employee }}"
          git push

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Vacaciones guardadas correctamente. Ya se muestran en el calendario del equipo.'
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
            function generateColor(text) {
              let hash = 0;
            
              for (let i = 0; i < text.length; i++) {
                hash = text.charCodeAt(i) + ((hash << 5) - hash);
              }
            
              let color = '#';
            
              for (let i = 0; i < 3; i++) {
                const value = (hash >> (i * 8)) & 255;
                color += ('00' + value.toString(16)).slice(-2);
              }
            
              return color;
            }
            ``
