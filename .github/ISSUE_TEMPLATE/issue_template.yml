name: Reporte de error
description: Crear un informe de error
title: "[BUG]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar este problema.

  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Explica el error observado.
      placeholder: Describe el problema...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a...
        2. Hacer clic en...
        3. Ver error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Entorno
      options:
        - Desarrollo
        - Pruebas
        - Producción
