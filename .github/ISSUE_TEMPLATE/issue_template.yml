name: Solicitud de vacaciones
description: Solicitar vacaciones

title: "[VACACIONES] "

body:
  - type: input
    id: empleado
    attributes:
      label: Empleado
      placeholder: Nombre del empleado
    validations:
      required: true

  - type: datepicker
    id: fecha_inicio
    attributes:
      label: Fecha inicio
      value: 01/01/2026
    validations:
      required: true

  - type: datepicker
    id: fecha_fin
    attributes:
      label: Fecha fin
      value: 01/01/2026
    validations:
      required: true

  - type: textarea
    id: comentarios
    attributes:
      label: Comentarios
      placeholder: Información adicional
